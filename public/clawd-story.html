<script>
"use strict";
/* =====================================================================
   CLAWD AND THE LITTLE STAR
   A tiny pixel-art story. Everything is drawn into a 96x120 software
   framebuffer and scaled up with image-rendering: pixelated.
   ===================================================================== */

// ---------------------------------------------------------------- screen
const W = 96, H = 120;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const IMG = ctx.createImageData(W, H);
const FB = new Uint32Array(IMG.data.buffer);   // ABGR on little-endian

// ---------------------------------------------------------------- palette
const PAL = {
  ink: '#1d1128', white: '#ffffff', black: '#05040c',
  // Clawd
  cl0: '#8a3a2a', cl1: '#b5553b', cl2: '#d97757', cl3: '#ec9a74', cl4: '#fbc6a2',
  blush: '#ff8aa6', mouth: '#5b1730', tongue: '#e8526a', tear: '#7fd0ff', glint: '#bfeaff',
  // the little star
  st0: '#c9701c', st1: '#f5a83a', st2: '#ffd650', st3: '#fff09a', st4: '#fffbe0',
  dm0: '#5a5476', dm1: '#7c7598', dm2: '#a29bbc', dm3: '#c7c1da', dm4: '#e6e2f0',
  // night sky
  n0: '#070716', n1: '#0c0c24', n2: '#121436', n3: '#1a1c4a', n4: '#23265e',
  n5: '#2f2f72', n6: '#403a84', n7: '#574491', n8: '#744e9b',
  // dawn
  d0: '#96599f', d1: '#c06a9e', d2: '#e27f98', d3: '#f7a08e', d4: '#ffc38a', d5: '#ffe0a0',
  // hills (night)
  h0: '#0a0f22', h1: '#0f1830', h2: '#14223d', h3: '#1a2e4a', h4: '#213c56',
  h5: '#28505e', h6: '#2f6563', h7: '#3d7d68', h8: '#5a9a6e',
  // far mountains
  mt1: '#252a5c', mt2: '#303872', mt3: '#454c8e',
  // forest
  f0: '#060a18', f1: '#0b1224', f2: '#101b33', f3: '#162642', f4: '#1e3352', f5: '#28435f',
  tr0: '#140e1c', tr1: '#221726', tr2: '#33222f',
  mu0: '#e0507f', mu1: '#ff86ad', mu2: '#ffc4d8', mug: '#63f0d8', mus: '#d8d0e6',
  // moon
  mo0: '#fff8e3', mo1: '#f4e2b2', mo2: '#dcc38e', mo3: '#c4a877',
  // hologram / code
  hz0: '#081226', hz1: '#10305a', hz2: '#2a7fc0', hz3: '#58d0ff', hz4: '#b8f2ff',
  cRed: '#ff6b7f', cYel: '#ffd35c', cGrn: '#6ef08a', cPur: '#c79bff', cOra: '#ff9d5c',
  // text
  tx: '#fff4e6', txDim: '#9c8fc4',
  // leaf
  lf0: '#123a2a', lf1: '#1f5a36', lf2: '#2f8243', lf3: '#56b057', lf4: '#9ade74', stem: '#6b4e33',
  // rain & clouds
  rn0: '#5e7fc8', rn1: '#9dbdf2', rn2: '#d6e6ff',
  cd0: '#171b38', cd1: '#20264a', cd2: '#2c345e', cd3: '#3f4a7c', cd4: '#6b77a8',
  // laptop
  lp0: '#262a40', lp1: '#3e4466', lp2: '#646d98', lp3: '#9aa3cc', lp4: '#cfd5ef',
  // hearts, fireflies, petals, dust, wood
  ht0: '#c9304f', ht1: '#ff5a7a', ht2: '#ffb3c4',
  ff0: '#c8ff6a', ff1: '#f6ffc4',
  pk0: '#ff9ec6', pk1: '#ffd3e6',
  du1: '#8f86a8',
  wd0: '#2a1a1f', wd1: '#4a2f2c', wd2: '#6d4636', wd3: '#94623f', wd4: '#c48a55',
  sun: '#fff1b8',
};
const C = {};
for (const k in PAL) C[k] = hex(PAL[k]);

function hex(h) {
  const n = parseInt(h.slice(1), 16);
  return (0xff000000 | (n & 255) << 16 | (n & 0xff00) | (n >> 16 & 255)) >>> 0;
}
const cR = c => c & 255, cG = c => c >>> 8 & 255, cB = c => c >>> 16 & 255;
function rgb(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r; g = g < 0 ? 0 : g > 255 ? 255 : g; b = b < 0 ? 0 : b > 255 ? 255 : b;
  return (0xff000000 | (b & 255) << 16 | (g & 255) << 8 | (r & 255)) >>> 0;
}
function mix(a, b, t) {
  return rgb(cR(a) + (cR(b) - cR(a)) * t, cG(a) + (cG(b) - cG(a)) * t, cB(a) + (cB(b) - cB(a)) * t);
}

// ---------------------------------------------------------------- math
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const TAU = Math.PI * 2;
const E = {
  inOut: t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2,
  out: t => 1 - (1 - t) ** 3,
  in: t => t * t * t,
  back: t => { const c = 1.70158; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; },
  bounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + .75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + .9375;
    return n * (t -= 2.625 / d) * t + .984375;
  },
};
function mulberry(seed) {
  return function () {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry(7);
const rr = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// 4x4 ordered dither thresholds
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bay = (x, y) => BAYER[(y & 3) << 2 | (x & 3)];

// ---------------------------------------------------------------- drawing primitives
// Everything draws into the current target (the screen, or an offscreen layer).
let TB = FB, TW = W, TH = H;
function target(L) { if (L) { TB = L.buf; TW = L.w; TH = L.h; } else { TB = FB; TW = W; TH = H; } }

function pset(x, y, c) {
  x = Math.floor(x); y = Math.floor(y);
  if (x >= 0 && y >= 0 && x < TW && y < TH) TB[y * TW + x] = c;
}
function rect(x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y);
  const x0 = Math.max(0, x), x1 = Math.min(TW, x + w), y0 = Math.max(0, y), y1 = Math.min(TH, y + h);
  if (x1 <= x0) return;
  for (let j = y0; j < y1; j++) TB.fill(c, j * TW + x0, j * TW + x1);
}
// dithered rectangle: only pixels whose threshold is below `a` are painted
function drect(x, y, w, h, c, a) {
  x = Math.round(x); y = Math.round(y);
  const x0 = Math.max(0, x), x1 = Math.min(TW, x + w), y0 = Math.max(0, y), y1 = Math.min(TH, y + h);
  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) if (bay(i, j) < a) TB[j * TW + i] = c;
}
function blendAt(i, c, a) {
  const d = TB[i];
  TB[i] = rgb(cR(d) + (cR(c) - cR(d)) * a, cG(d) + (cG(c) - cG(d)) * a, cB(d) + (cB(c) - cB(d)) * a);
}
function brect(x, y, w, h, c, a) {
  x = Math.round(x); y = Math.round(y);
  const x0 = Math.max(0, x), x1 = Math.min(TW, x + w), y0 = Math.max(0, y), y1 = Math.min(TH, y + h);
  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) blendAt(j * TW + i, c, a);
}
function addAt(i, r, g, b) {
  const d = TB[i];
  TB[i] = rgb(cR(d) + r, cG(d) + g, cB(d) + b);
}
function addPx(x, y, c, k = 1) {
  x = Math.floor(x); y = Math.floor(y);
  if (x >= 0 && y >= 0 && x < TW && y < TH) addAt(y * TW + x, cR(c) * k, cG(c) * k, cB(c) * k);
}
// soft light, quantised into a few dithered bands so it still reads as pixel art
function glow(cx, cy, rad, c, k = 1, steps = 4, dither = true) {
  if (rad <= 0 || k <= 0) return;
  const r = cR(c), g = cG(c), b = cB(c), r2 = rad * rad;
  const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(TW - 1, Math.ceil(cx + rad));
  const y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(TH - 1, Math.ceil(cy + rad));
  for (let y = y0; y <= y1; y++) {
    const dy = y + .5 - cy;
    for (let x = x0; x <= x1; x++) {
      const dx = x + .5 - cx, d2 = (dx * dx + dy * dy) / r2;
      if (d2 >= 1) continue;
      const f = (1 - d2) * (1 - d2) * k;
      const q = Math.floor(f * steps + (dither ? bay(x, y) : .5)) / steps;
      if (q > 0) addAt(y * TW + x, r * q, g * q, b * q);
    }
  }
}
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let n = 0; n < 600; n++) {
    pset(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function lineAdd(x0, y0, x1, y1, c, k) {
  const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1));
  for (let i = 0; i <= n; i++) addPx(Math.round(lerp(x0, x1, i / n)), Math.round(lerp(y0, y1, i / n)), c, k);
}
function disc(cx, cy, r, c) {
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
    const dy = y + .5 - cy, hw = r * r - dy * dy;
    if (hw < 0) continue;
    const s = Math.sqrt(hw);
    const x0 = Math.round(cx - s), x1 = Math.round(cx + s);
    if (y >= 0 && y < TH) rect(x0, y, x1 - x0, 1, c);
  }
}
function ring(cx, cy, rx, ry, c) {
  const n = Math.max(12, Math.ceil(Math.max(rx, ry) * 7));
  for (let i = 0; i < n; i++) { const a = i / n * TAU; pset(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, c); }
}
function ellipseD(cx, cy, rx, ry, c, a) {    // dithered ellipse (soft shadows)
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
    const d = dx * dx + dy * dy;
    if (d < 1 && bay(x, y) < a * (1 - d * .6) && x >= 0 && y >= 0 && x < TW && y < TH) TB[y * TW + x] = c;
  }
}
// cheap deterministic hash for textures
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- sprites
// Sprites are hand-coded as arrays of strings, one character per pixel.
// '.' is transparent; every other character is looked up in a small key.
const KEY = {
  clawd: { o: 'ink', 0: 'cl0', 1: 'cl1', 2: 'cl2', 3: 'cl3', 4: 'cl4', w: 'white' },
  face: { k: 'ink', w: 'white', b: 'glint', p: 'blush', m: 'mouth', r: 'tongue', t: 'tear', h: 'ht1', 2: 'cl2', 3: 'cl3' },
  star: { o: 'ink', 0: 'st0', 1: 'st1', 2: 'st2', 3: 'st3', 4: 'st4' },
  dim: { o: 'ink', 0: 'dm0', 1: 'dm1', 2: 'dm2', 3: 'dm3', 4: 'dm4' },
  sface: { k: 'ink', p: 'blush', m: 'mouth', r: 'tongue', t: 'tear', w: 'white' },
  icon: { o: 'ink', w: 'white', y: 'st3', Y: 'st2', r: 'ht1', R: 'ht0', l: 'ht2', b: 'tear', B: 'glint', g: 'cGrn', m: 'mouth', c: 'hz3' },
  prop: {
    o: 'ink', a: 'lp0', b: 'lp1', c: 'lp2', d: 'lp3', e: 'lp4', s: 'cl2', S: 'cl4',
    1: 'lf1', 2: 'lf2', 3: 'lf3', 4: 'lf4', 0: 'lf0', t: 'stem',
    u: 'wd1', v: 'wd2', x: 'wd3', z: 'wd4', q: 'wd0',
    m: 'mu0', n: 'mu1', N: 'mu2', i: 'mus', w: 'white',
  },
  moon: { a: 'mo0', b: 'mo1', c: 'mo2', d: 'mo3' },
  logo: { o: 'ink', 1: 'cl1', 2: 'cl2', 3: 'cl3', 4: 'cl4', w: 'white', 0: 'cl0' },
};
function spr(rows, key) {
  const h = rows.length, w = rows[0].length;
  const px = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) throw new Error('ragged sprite row ' + y + ': ' + rows[y]);
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      const name = key[ch];
      if (!name) throw new Error('no colour for "' + ch + '"');
      px[y * w + x] = C[name];
    }
  }
  return { w, h, px, rows };
}
// blit with optional mirror, solid colour (silhouette / flash) and dithered alpha
function blit(s, x, y, flip = false, solid = 0, alpha = 1) {
  x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < s.h; j++) {
    const yy = y + j;
    if (yy < 0 || yy >= TH) continue;
    for (let i = 0; i < s.w; i++) {
      const xx = x + i;
      if (xx < 0 || xx >= TW) continue;
      const c = s.px[j * s.w + (flip ? s.w - 1 - i : i)];
      if (!c) continue;
      if (alpha < 1 && bay(xx, yy) >= alpha) continue;
      TB[yy * TW + xx] = solid || c;
    }
  }
}

// ---------------------------------------------------------------- Clawd
// Clawd is a paper doll: a body, four legs, two arms and a face, all
// hand-pixelled. The body is squashed and stretched by duplicating or
// removing interior rows/columns, so outlines stay crisp at every size.
const CLAWD_BODY = [
  '..oooooooooooooo..',
  '.o34443333333332o.',
  'o3w32222222222221o',
  'o3322222222222221o',
  'o3222222222222221o',
  'o3222222222222221o',
  'o3222222222222221o',
  'o3222222222222221o',
  'o3222222222222211o',
  'o2211111111111110o',
  '.o11111111111100o.',
  '..oooooooooooooo..',
];
// legs by length (the first row overlaps the body's bottom outline)
const CLAWD_LEGS = [
  null,
  spr(['o11o', '.oo.'], KEY.clawd),
  spr(['o21o', 'o11o', '.oo.'], KEY.clawd),
  spr(['o21o', 'o21o', 'o11o', '.oo.'], KEY.clawd),
  spr(['o21o', 'o21o', 'o21o', 'o11o', '.oo.'], KEY.clawd),
];
// right arm poses; the left arm is mirrored. [rows, anchorX, anchorY] where the
// anchor pixel sits on the body's side outline, 5 rows below the top.
const ARM_DEF = {
  rest: [['oo.', '22o', '11o', 'oo.'], 0, 0],
  down: [['o..', '2o.', '22o', '11o', 'oo.'], 0, 0],
  out: [['ooo.', '222o', '111o', 'ooo.'], 0, 0],
  up: [['..oo.', '.o32o', 'o221o', '221o.', '21o..', 'oo...'], 0, 3],
  high: [['.oo.', 'o32o', 'o22o', 'o21o', '221o', '21o.', 'oo..'], 0, 5],
};
const ARMS = {};
for (const k in ARM_DEF) ARMS[k] = { s: spr(ARM_DEF[k][0], KEY.clawd), ax: ARM_DEF[k][1], ay: ARM_DEF[k][2] };

// faces: 14x6 overlays laid over the body (masked to the body's fill)
const FACE_DEF = {
  normal: [
    '..............',
    '..wk......wk..',
    '..kk......kk..',
    '..kk......kk..',
    '..............',
    '..............'],
  blink: [
    '..............',
    '..............',
    '..............',
    '..kk......kk..',
    '..............',
    '..............'],
  happy: [
    '..............',
    '..kk......kk..',
    '.k..k....k..k.',
    '..............',
    '.pp........pp.',
    '..............'],
  joy: [
    '..............',
    '..kk......kk..',
    '.k..k....k..k.',
    '..............',

    '......mm......'],
  smile: [

    '......mm......'],
  content: [

    '..............'],
  surprised: [
    '..wk......wk..',
    '..kk......kk..',

  sparkle: [

    '.pp........pp.',
    '..............'],
  determined: [
    '..............',

    '..............'],
  sad: [
    '..............',
    '...k......k...',

  teary: [
    '..............',

    '..bb......bb..',
    '.pp........pp.',
    '......mm......'],
  cry: [

    '.....mrrm.....'],
  squint: [

  worried: [

  yawn: [

  wink: [

    'ppp..m.m...ppp',
    '......m.m.....'],
};
const FACES = {};
for (const k in FACE_DEF) FACES[k] = spr(FACE_DEF[k], KEY.face);

// squash / stretch variants of the body, cached by (dw, dh)
const BODY_CACHE = {};
function bodyVariant(dw, dh) {
  const key = dw + ',' + dh;
  if (BODY_CACHE[key]) return BODY_CACHE[key];
  const src = CLAWD_BODY, bw = src[0].length, bh = src.length;
  let cols = [...Array(bw).keys()], rows = [...Array(bh).keys()];
  if (dw > 0) {
    const ins = []; for (let i = 0; i < dw; i++) ins.push(i % 2 ? 9 : 8);
    cols = [...cols.slice(0, 9), ...ins, ...cols.slice(9)];
  } else if (dw < 0) {
    const rm = [8, 9, 7, 10].slice(0, -dw); cols = cols.filter(c => !rm.includes(c));
  }
  if (dh > 0) rows = [...rows.slice(0, 8), ...Array(dh).fill(7), ...rows.slice(8)];
  else if (dh < 0) { const rm = [8, 9, 7].slice(0, -dh); rows = rows.filter(r => !rm.includes(r)); }
  const out = rows.map(r => cols.map(c => src[r][c]).join(''));
  const s = spr(out, KEY.clawd);
  s.fill = new Uint8Array(s.w * s.h);

// draw Clawd. c = { x, y (ground under his feet), sq (-1 squash .. +1 stretch),
//   legs [4 lengths], armL, armR, armLy, armRy, face, lx, ly (look), sit, bob,
//   shx (tremble), tint [colour, amount], solid, alpha }
function drawClawd(c) {
  const dh = clamp(Math.round(c.sq * 3), -3, 4);
  const dw = clamp(Math.round(-c.sq * 3.4), -3, 4);
  const b = bodyVariant(dw, dh);
  const bottom = Math.round(c.y) - (c.sit ? 1 : 3) + (c.bob | 0);
  const top = bottom - (b.h - 1);
  const left = Math.round(c.x - b.w / 2) + (c.shx | 0);
  const solid = c.solid || 0, alpha = c.alpha == null ? 1 : c.alpha;
  blit(b, left, top, false, solid, alpha);
  // face, masked to the body's fill pixels
  if (!solid) {
    const f = FACES[c.face] || FACES.normal;
    const fx = left + Math.round((b.w - 14) / 2) + (c.lx | 0), fy = top + 2 + (c.ly | 0);
    for (let j = 0; j < f.h; j++) for (let i = 0; i < f.w; i++) {
      const col = f.px[j * f.w + i];
      if (!col) continue;
      const bx = fx + i - left, by = fy + j - top;
      if (bx < 0 || by < 0 || bx >= b.w || by >= b.h || !b.fill[by * b.w + bx]) continue;
      const X = fx + i, Y = fy + j;
      if (X < 0 || Y < 0 || X >= TW || Y >= TH) continue;
      if (alpha < 1 && bay(X, Y) >= alpha) continue;
      TB[Y * TW + X] = col;
    }
  }
  if (c.tint && !solid) {
    const tc = c.tint[0], ta = c.tint[1];
    for (let j = 0; j < b.h; j++) {
      const a = ta * clamp((j - 1) / (b.h - 2), .25, 1), Y = top + j;
      if (Y < 0 || Y >= TH) continue;
      for (let i = 0; i < b.w; i++) {
        const X = left + i;
        if (X >= 0 && X < TW && b.fill[j * b.w + i]) blendAt(Y * TW + X, tc, a);
      }
    }
  }
  // legs
  const legX = [1, 4, b.w - 8, b.w - 5];
  const legs = c.legs || [3, 3, 3, 3];
  for (let i = 0; i < 4; i++) {
    const L = CLAWD_LEGS[legs[i]];
    if (L) blit(L, left + legX[i], bottom, false, solid, alpha);
  }
  // arms
  const ar = ARMS[c.armR || 'rest'], al = ARMS[c.armL || 'rest'];
  if (ar) blit(ar.s, left + b.w - 1 - ar.ax, top + 5 - ar.ay + (c.armRy | 0), false, solid, alpha);
  if (al) blit(al.s, left - (al.s.w - 1 - al.ax), top + 5 - al.ay + (c.armLy | 0), true, solid, alpha);
  return { left, top, w: b.w, h: b.h, bottom };
}

// ---------------------------------------------------------------- parallax layers
function layer(w, h, paint) {
  const L = { w, h, buf: new Uint32Array(w * h) };

  return L;
}

  ox = Math.round(ox); oy = Math.round(oy);
  const y0 = Math.max(0, oy), y1 = Math.min(H, oy + L.h), buf = L.buf, lw = L.w;
  for (let y = y0; y < y1; y++) {
    const row = (y - oy) * lw, o = y * W;
    if (wrap) {
      let lx = ((-ox) % lw + lw) % lw;
      for (let x = 0; x < W; x++) {
        const c = buf[row + lx];
        if (c) FB[o + x] = c;
        if (++lx === lw) lx = 0;

    } else {
      const xa = Math.max(0, ox), xb = Math.min(W, ox + lw);

  const out = { w: L.w, h: L.h, buf: L.buf.map(c => map.has(c) ? map.get(c) : c) };

// ---------------------------------------------------------------- transitions
const CLAWD_MASK = [
  '...############...',
  '...############...',
  '...##.######.##...',
  '...##.######.##...',
  '.################.',
  '.################.',
  '...############...',
  '...############...',
  '....#.#....#.#....',
  '....#.#....#.#....',
];
function inStar(x, y, r, rot) {
  const a = Math.atan2(y, x) - rot, d = Math.hypot(x, y);

  const k = Math.abs(seg - .5) * 2;                                  // 1 at tips, 0 between

}
// p: 0 = clear, 1 = fully covered
function applyMask(kind, p, dir, cx, cy) {
  if (p <= 0) return;
  const col = kind === 'white' ? C.white : C.black;
  if (p >= 1) { rect(0, 0, W, H, col); return; }
  if (kind === 'fade' || kind === 'white') { brect(0, 0, W, H, col, Math.round(p * 10) / 10); return; }
  if (kind === 'wipe') {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const u = (x + y * .35) / (W + H * .35), e = bay(x, y) * .08;
      if (dir === 'out' ? u < p * 1.08 - .08 + e : u > 1.08 - p * 1.08 - e) FB[y * W + x] = C.black;
    }
    return;
  }
  const q = 1 - p;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = x + .5 - cx, dy = y + .5 - cy;
    let inside;
    if (kind === 'iris') inside = dx * dx + dy * dy < (q * 105) ** 2;
    else if (kind === 'star') inside = inStar(dx, dy, q * 150, -Math.PI / 2 + p * 1.2);
    else {                                   // clawd-shaped iris
      const s = p < .6 ? lerp(34, 2.8, E.out(p / .6)) : p < .8 ? 2.8 : lerp(2.8, 0, (p - .8) / .2);
      const mx = Math.floor(dx / s + 9), my = Math.floor(dy / s + 5);
      inside = my >= 0 && my < 10 && mx >= 0 && mx < 18 && CLAWD_MASK[my][mx] === '#';
    }
    if (!inside) FB[y * W + x] = C.black;
  }
}

// ---------------------------------------------------------------- scenery: the hill (night & dawn)

    }

// ---------------------------------------------------------------- scene machinery
let S = null, SI = 0;
const SCENES = [];
const TR = { phase: 'none', t: 0, dur: 0, kind: 'fade', next: 0, cx: W / 2, cy: H / 2 };
const at = t => S.pt < t && S.t >= t;

const themeMeta = document.querySelector('meta[name="theme-color"]');
function startScene(i) {
  SI = i;
  const sc = SCENES[i];
  rnd = mulberry(1000 + i * 77);
  PARTS = [];
  S = { t: 0, pt: -1, sc, cam: { x: 0, y: 0 }, ox: 0, oy: 0, shake: 0, flash: 0, flashC: C.white, lb: 0, bubbles: [], cap: null, dustC: C.du1, focus: null };
  sc.init(S);
}
// let the page around the canvas continue the colours at its top and bottom edges
const backTop = document.getElementById('backTop'), backBottom = document.getElementById('backBottom');
function rowColour(y) {
  let r = 0, g = 0, b = 0;
  for (let x = 0; x < W; x++) { const c = FB[y * W + x]; r += cR(c); g += cG(c); b += cB(c); }
  return 'rgb(' + (r / W | 0) + ',' + (g / W | 0) + ',' + (b / W | 0) + ')';
}
function syncBackdrop() {
  const top = rowColour(0), portrait = window.innerHeight / window.innerWidth > H / W;
  const bottom = portrait ? rowColour(H - 1) : top;
  if (backTop.dataset.c !== top) { backTop.dataset.c = top; backTop.style.backgroundColor = top; if (themeMeta) themeMeta.content = top; }
  if (backBottom.dataset.c !== bottom) { backBottom.dataset.c = bottom; backBottom.style.backgroundColor = bottom; }
}
function goTo(i) {
  if (TR.phase === 'out') return;
  const cur = SCENES[SI];
  TR.next = (i + SCENES.length) % SCENES.length;
  TR.kind = cur.tout || 'fade';
  TR.dur = TR.kind === 'cut' ? 0 : cur.toutDur || .7;
  const f = S.focus || [W / 2, H / 2];
  TR.cx = f[0]; TR.cy = f[1];
  TR.phase = 'out'; TR.t = 0;
}
function update(dt) {
  if (TR.phase === 'out') {
    TR.t += dt;
    if (TR.t >= TR.dur) {
      startScene(TR.next);
      const sc = SCENES[SI];
      TR.kind = sc.tin || 'fade';
      TR.dur = TR.kind === 'cut' ? 0 : sc.tinDur || .7;
      TR.t = 0; TR.phase = 'in';
      const f = S.focus || [W / 2, H / 2];
      TR.cx = f[0]; TR.cy = f[1];
    }
  } else if (TR.phase === 'in') {
    TR.t += dt;
    if (TR.t >= TR.dur) TR.phase = 'none';
  }
  S.pt = S.t; S.t += dt;
  S.sc.update(S, dt);
  updParts(dt);
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 5);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt * 2.2);
  if (S.cap) { S.cap.t += dt; if (S.cap.t > S.cap.dur) S.cap = null; }
  for (const b of S.bubbles) b.t += dt;
  S.bubbles = S.bubbles.filter(b => b.t < b.dur);
  if (TR.phase === 'none' && S.sc.dur && S.t >= S.sc.dur) goTo(SI + 1);
}
const vrnd = mulberry(4242);
let frameNo = 0;
function render() {
  target(null);
  const sh = S.shake > 0 && !REDUCED ? S.shake : 0;
  S.ox = sh ? Math.round((vrnd() * 2 - 1) * sh) : 0;
  S.oy = sh ? Math.round((vrnd() * 2 - 1) * sh) : 0;
  S.sc.draw(S);
  if (S.flash > 0) {
    const a = Math.round(Math.min(1, S.flash) * 6) / 6 * (REDUCED ? .4 : 1);
    if (a > 0) brect(0, 0, W, H, S.flashC, a);
  }
  if (S.lb > 0) { const h = Math.round(S.lb * 13); rect(0, 0, W, h, C.black); rect(0, H - h, W, h, C.black); }
  for (const b of S.bubbles) drawBubble(b);
  drawCaption();
  if (TR.phase !== 'none' && TR.dur > 0) {
    const p = clamp(TR.t / TR.dur, 0, 1);
    const e = TR.kind === 'clawd' ? p : E.inOut(p);
    applyMask(TR.kind, TR.phase === 'out' ? e : 1 - e, TR.phase, TR.cx, TR.cy);
  }
  ctx.putImageData(IMG, 0, 0);
  if (++frameNo % 20 === 1) syncBackdrop();
}

function shootingStar(x0, y0, x1, y1, p, len = 12) {
  if (p <= 0 || p >= 1.3) return;
  const q = Math.min(p, 1), hx = lerp(x0, x1, q), hy = lerp(y0, y1, q);
  const d = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / d, uy = (y1 - y0) / d;
  const fade = p > 1 ? 1 - (p - 1) / .3 : 1;
  for (let i = 0; i < len; i++) addPx(hx - ux * i, hy - uy * i, C.st4, (1 - i / len) * fade * .85);
  if (p < 1) { glow(hx, hy, 3.5, C.st3, .5); pset(hx, hy, C.white); }
}

// ---------------------------------------------------------------- scenery: the forest
const PATH_C = [hex('#211c33'), hex('#2c2540'), hex('#3a3152'), hex('#4a4066')];
function buildForest() {
  const set = {};
  set.stars = makeStars(17, 26, 0, 192, 0, 34);
  set.far = layer(192, 100, L => {
    const r = mulberry(61), trees = [];
    for (let i = 0; i < 30; i++) trees.push([i * 6.4 + r() * 5, 44 + r() * 46, 11 + r() * 8]);
    for (const [x, h, w] of trees) wrapDraw(192, x, 12, X => pine(X, 100, h, w, C.f2));
    rimLayer(L, C.f3, -1, 0, C.f2);
  });
  set.mid = layer(192, 116, L => {
    const r = mulberry(71), trees = [];
    for (let i = 0; i < 8; i++) trees.push([i * 24 + r() * 10, 60 + r() * 36, 9 + r() * 5]);
    for (const [x, h, rad] of trees) wrapDraw(192, x, 26, X => puffTree(X, 116, h, rad, C.f3, C.tr1));
    rimLayer(L, C.f5, -1, 0, C.f3);
    rimLayer(L, C.f4, 0, -1, C.f3);
  });
  set.near = layer(256, 126, L => {
    const r = mulberry(83), trunks = [], leaves = [];
    for (let i = 0; i < 5; i++) trunks.push([i * 51 + r() * 22, 5 + Math.floor(r() * 3)]);
    for (const [x, w] of trunks) wrapDraw(256, x, 14, X => {
      rect(X, 0, w, 126, C.tr0); rect(X - 2, 118, w + 4, 8, C.tr0); rect(X - 4, 122, w + 8, 4, C.tr0);
    });
    rimLayer(L, C.tr2, -1, 0, C.tr0);
    for (let i = 0; i < 12; i++) leaves.push([r() * 256, r() * 10, 7 + r() * 9]);
    for (const [x, y, rad] of leaves) wrapDraw(256, x, 18, X => disc(X, y, rad, C.f1));
    rimLayer(L, C.f2, 0, 1, C.f1);
  });
  set.ground = layer(192, 26, L => {
    for (let x = 0; x < 192; x++) {
      const top = 2 + Math.round(Math.sin(x / 192 * TAU * 5) * .7 + Math.sin(x / 192 * TAU * 13) * .6);
      for (let y = top; y < 26; y++) {
        const d = y - top, hs = hash2(x, y + 300);
        let c = d < 1 ? C.h6 : d < 2 ? C.h5 : d < 4 ? PATH_C[3] : PATH_C[2];
        if (d >= 4 && hs < .08) c = PATH_C[3];
        else if (d >= 4 && hs > .93) c = PATH_C[1];
        if (d > 8 && bay(x, y) < (d - 8) / 7) c = PATH_C[1];
        if (d > 14 && bay(x, y) < (d - 14) / 6) c = PATH_C[0];
        pset(x, y, c);
      }
      if (hash2(x, 11) < .4) pset(x, top - 1, C.h5);
      if (hash2(x, 12) < .15) { pset(x, top - 1, C.h6); pset(x, top - 2, C.h5); }
    }
  });
  set.fg = layer(256, 30, L => {
    const r = mulberry(91), bushes = [];
    for (let i = 0; i < 7; i++) bushes.push([i * 37 + r() * 20, 6 + r() * 6]);
    for (const [x, rad] of bushes) wrapDraw(256, x, 22, X => {
      disc(X, 30, rad * 1.4, C.f0); disc(X + rad, 31, rad, C.f0); disc(X - rad * 1.1, 32, rad * .9, C.f0);
    });
    rimLayer(L, C.f1, 0, -1, C.f0);
  });
  const r = mulberry(95);
  set.mush = [];
  for (let i = 0; i < 9; i++) set.mush.push({ x: i * 21 + r() * 12, big: r() < .45, ph: r() * TAU });
  set.flies = makeFlies(29, 12, 0, 192, 40, 96);
  return set;
}

    rimLayer(L, C.tr2, 1, 0, C.tr0, false);
    rimLayer(L, C.tr1, -1, 0, C.tr0, false);
    disc(8, 4, 17, C.f1); disc(24, -3, 13, C.f1); disc(0, 26, 12, C.f1); disc(30, 6, 7, C.f1);
    disc(104, 6, 16, C.f1); disc(88, -2, 12, C.f1); disc(112, 28, 11, C.f1); disc(82, 7, 6, C.f1);
    rimLayer(L, C.f2, 0, 1, C.f1, false);
    rimLayer(L, C.f3, 1, 0, C.f1, false);
  });
  set.ground = layer(112, 30, L => {
    for (let y = 0; y < 30; y++) for (let x = 0; x < 112; x++) {
      const hs = hash2(x, y + 900);
      let c = y < 2 ? C.h4 : y < 7 ? C.h5 : C.h6;
      if (y >= 2 && hs < .09) c = y < 7 ? C.h6 : C.h7;
      else if (hs > .92) c = y < 7 ? C.h4 : C.h5;
      if (y > 16 && bay(x, y) < (y - 16) / 10) c = C.h5;
      const dx = (x - 72) / 15, dy = (y - 5) / 3.6, d = dx * dx + dy * dy;
      if (d < 1) c = d > .7 ? (dy < 0 ? C.h7 : C.h3) : d > .35 ? C.h3 : C.h2;

    }
    for (let x = 0; x < 112; x++) if (hash2(x, 3) < .45) pset(x, 0, C.h4);

  set.mush = [{ x: 14, big: true, ph: 0 }, { x: 20, big: false, ph: 2 }, { x: 84, big: true, ph: 4 }, { x: 78, big: false, ph: 1 }];
  set.flies = makeFlies(31, 8, 0, 96, 46, 96);
  return set;
}

// ---------------------------------------------------------------- hologram terminal
function drawTerminal(T, t) {
  if (T.open <= 0) return;
  const hh = Math.max(1, Math.round(T.h * T.open)), y0 = T.y + Math.round((T.h - hh) / 2);
  const ww = T.open < .15 ? Math.round(T.w * T.open / .15) : T.w, x0 = T.x + Math.round((T.w - ww) / 2);
  brect(x0, y0, ww, hh, C.hz0, .8);
  for (let y = y0; y < y0 + hh; y += 2) brect(x0, y, ww, 1, C.hz1, .3);
  rect(x0, y0, ww, 1, C.hz3); rect(x0, y0 + hh - 1, ww, 1, C.hz3);
  rect(x0, y0, 1, hh, C.hz3); rect(x0 + ww - 1, y0, 1, hh, C.hz3);
  if (T.open < 1) return;
  rect(x0 + 1, y0 + 1, ww - 2, 5, C.hz1);
  pset(x0 + 3, y0 + 3, C.cRed); pset(x0 + 6, y0 + 3, C.cYel); pset(x0 + 9, y0 + 3, C.cGrn);
  let y = y0 + 8;
  for (const L of T.lines) {
    const n = Math.floor((t - L.t0) * 26);
    if (n <= 0) break;
    drawText(L.text.slice(0, n), x0 + 3, y, L.c);
    y += 7;
    if (L.bar) {
      const p = clamp((t - L.bar[0]) / (L.bar[1] - L.bar[0]), 0, 1), bw = ww - 8;
      rect(x0 + 3, y, bw + 2, 4, C.hz2); rect(x0 + 4, y + 1, bw, 2, C.hz0);
      rect(x0 + 4, y + 1, Math.round(bw * p), 2, p >= 1 ? C.cGrn : C.cYel);
      y += 6;
    }
  }
  if ((Math.floor(t * 3) & 1) && y < y0 + hh - 6) rect(x0 + 3, y, 3, 5, C.hz4);
}

    rect(0, 46, 192, 24, C.cd2);

  });

  set.hills = layer(192, 90, L => {
    for (let x = 0; x < 192; x++) rect(x, Math.round(hr[x]), 1, 90, C.h2);

    rimLayer(L, C.h3, 0, -1, C.h2);

  set.ground = layer(420, 180, L => {
    for (let x = 0; x < 420; x++) {
      const wx = x - 40, top = Math.round(pathY(wx)) + 40;
      for (let y = Math.max(0, top); y < 180; y++) {
        const d = y - top, hs = hash2(wx, y + 77);
        let c = d < 1 ? C.h8 : d < 2 ? C.h7 : d < 5 ? C.h6 : C.h5;
        if (d >= 3 && hs < .08) c = C.h7;
        else if (d >= 5 && hs > .9) c = C.h4;
        if (d > 12 && bay(x, y) < (d - 12) / 14) c = C.h4;
        if (d > 26) c = bay(x, y) < (d - 26) / 20 ? C.h3 : C.h4;
        pset(x, y, c);

    }
    const r = mulberry(61);
    for (let i = 0; i < 60; i++) {
      const wx = -40 + r() * 420, y = Math.round(pathY(wx)) + 40 + 2 + Math.floor(r() * 16);

      rect(wx + 40, y, 4, 2, C.h3); rect(wx + 41, y - 1, 2, 1, C.h4);
    }

}

      const [a, b, l0, l1] = S.rise;
      s.lift = lerp(l0, l1, E.inOut(prog(t, a, b)));
      if (t > 8.8 && t < 12.6 && rnd() < .6) emit({ type: rnd() < .5 ? 'spark' : 'glow', x: s.x + rr(-3, 3), y: s.y - s.lift - 5 + rr(-2, 2), vx: rr(-4, 4), vy: rr(2, 10), life: rr(.6, 1.2), s: rr(1, 2.4), c: pick([C.st3, C.st4, C.white]), z: 1 });
    }
    if (at(9.2)) { c.wave = 2; say(c, 'BYE BYE!', 2.2); }
    if (at(12.7)) { S.skyStar = { x: s.x, y: s.y - s.lift - 6, t: 0 }; s.vis = false; S.flash = .35; S.flashC = C.st4; burst(s.x, s.y - s.lift - 6, 20, [C.st3, C.white], 40, 2, .9); }
    if (S.skyStar) S.skyStar.t += dt;
    if (at(13.6)) { c.faceBase = 'cry'; c.wave = 1; c.look = null; c.sqv -= 3; }
    if (at(15.2)) { c.faceBase = 'teary'; c.look = [0, -1]; }
    if (t > 14 && t < 17 && Math.floor(t * 3) !== Math.floor(S.pt * 3)) {
      emit({ type: 'tear', x: c.x - 5, y: c.y - 8, vx: -rr(8, 14), vy: -rr(10, 20), ay: 220, life: .8, z: 2 });
      emit({ type: 'tear', x: c.x + 5, y: c.y - 8, vx: rr(8, 14), vy: -rr(10, 20), ay: 220, life: .8, z: 2 });
    }
    if (at(15)) caption('GOODBYE, LITTLE STAR.', 4);
    if (at(17.2)) { c.faceBase = 'smile'; c.wave = 0; c.look = [0, -1]; }
    if (at(18.6)) { c.look = null; express(c, 'content', 2); }
    if (t > 12 && rnd() < dt * 3) emit({ type: 'petal', x: S.cam.x - 4, y: rr(20, 100), vx: rr(14, 24), vy: rr(-2, 5), life: 7, ph: rr(0, 3), z: 2, upd: p => { p.vy += Math.sin(p.t * 2.2 + p.ph) * .5; } });
    updClawd(c, dt); updStar(s, dt);
  },
  draw(S) {
    const set = S.set, c = S.clawd, s = S.star, cx = S.cam.x + S.ox, cy = S.cam.y + S.oy, t = S.t;
    const k = Math.round(S.dp * 8) / 8, P = HILL_PAL.night, D = HILL_PAL.dawn;
    const pairs = [[P.mb, D.mb], [P.mbr, D.mbr], [P.mf, D.mf], [P.mfr, D.mfr], [P.mid, D.mid], [P.midr, D.midr], [P.tree, D.tree], [P.hill, D.hill], [P.hd, D.hd], [P.hl, D.hl], [P.rim, D.rim], [P.tuft, D.tuft]];
    const tset = {
      P: { hd: mix(P.hd, D.hd, k), fg: mix(P.fg, D.fg, k) },
      mount: tinted(set.mount, pairs, k, 'm'), mid: tinted(set.mid, pairs, k, 'mid'), hill: tinted(set.hill, pairs, k, 'h'),
      haze: set.haze, stars: set.stars, window: set.window, flies: set.flies,
    };
    const sunY = lerp(98, 50, E.out(prog(t, 9.5, 21)));
    drawHill(tset, S, {
      sky: dawnStops(S.dp), starA: 1 - prog(S.dp, .35, .9), moon: [8, lerp(14, 30, S.dp)], flies: false,
      sky2: (ox, oy) => {
        if (S.skyStar) {
          const st = S.skyStar, a = 1 - prog(t, 19, 21) * .6;
          skyStar(st.x - ox, st.y - oy, Math.max(.4, 1 - st.t / 2) * a, t);
        }
        glow(70 - ox, sunY - oy, 26 + 20 * S.dp, C.d5, .5 * S.dp, 8, false);
        disc(70 - ox, sunY - oy, 7, C.sun);
      },
      behindMid: (ox, oy) => drawLayer(tinted(S.sea, [[C.d1, C.n5], [C.d3, C.n7], [C.d5, C.d1]], 1 - k, 'sea'), -ox * .4 + t * 1.5, 72 - oy * .5),
    });
    drawActor(c, cx, cy, tset.P.hd);
    drawStarActor(s, cx, cy, t);
    drawParts(1, cx, cy);
    drawFgGrass(cx, cy, t, tset.P.fg);
    drawParts(2, cx, cy);
  },
});

// ---- 8. the next night
const CONSTELLATION = [[3, 0], [15, 0], [15, 4], [17, 4], [17, 6], [15, 6], [15, 8], [13.5, 8], [13.5, 10], [13.5, 8], [11.5, 8], [11.5, 10], [11.5, 8], [6.5, 8], [6.5, 10], [6.5, 8], [4.5, 8], [4.5, 10], [4.5, 8], [3, 8], [3, 6], [1, 6], [1, 4], [3, 4], [3, 0]];
const CON_EYES = [[5.5, 2.5], [12.5, 2.5]];
const conPt = ([x, y]) => [48 + (x - 9) * 2.4, 40 + (y - 5) * 2.4];
SCENES.push({
  name: 'epilogue', dur: 16.4, tin: 'fade', tinDur: .8, tout: 'clawd', toutDur: 2.2,
  init(S) {
    S.set = once('hillNight', () => buildHill('night'));
    const c = S.clawd = newClawd(48, 98);
    c.sit = true; c.typing = 1; c.look = [0, 1];
    S.laptop = true; S.con = -1;
    S.focus = [48, 88];
  },
  update(S, dt) {
    const c = S.clawd, t = S.t;
    if (at(.3)) caption('THE NEXT NIGHT...', 2.4, 'mid');
    if (at(3.6)) S.con = 0;
    if (S.con >= 0) S.con += dt;
    if (at(4.2)) { c.typing = 0; c.look = [0, -1]; c.faceBase = 'surprised'; emote(c, 'bang', 1.2); }
    if (at(5.6)) c.faceBase = 'sparkle';
    if (at(8.2)) { c.sit = false; c.faceBase = 'joy'; jump(c, 115); hearts(c.x, c.y - 18, 4); c.tint = null; S.laptop = 'shut'; }
    if (at(9.2)) caption('NOW, EVERY NIGHT,\nA STAR SAYS HELLO.', 4.4);
    if (at(9.6)) { c.wave = 3; c.faceBase = 'joy'; }
    if (at(12.3)) { c.wave = 0; c.sit = true; c.faceBase = 'smile'; S.laptop = true; c.typing = 1; c.look = [0, 1]; }
    if (at(13.4)) emote(c, 'heart', 1.6);
    if (at(14.7)) { c.typing = 0; c.look = [0, 0]; c.faceBase = 'wink'; }
    c.tint = S.laptop === true && !c.air ? [C.hz3, .2] : null;
    S.cam.x = lerp(3, -3, E.inOut(prog(t, 0, 16.4)));
    updClawd(c, dt);
  },
  draw(S) {
    const c = S.clawd, set = S.set, cx = S.cam.x + S.ox, cy = S.cam.y + S.oy, t = S.t;
    drawHill(set, S, {
      sky2: () => {
        if (S.con < 0) { skyStar(70, 26, .6, t); return; }
        const k = S.con, n = CONSTELLATION.length, shown = k * 7;
        for (let i = 0; i < n - 1; i++) {
          const f = clamp(shown - i, 0, 1);
          if (f <= 0) break;
          const [x0, y0] = conPt(CONSTELLATION[i]), [x1, y1] = conPt(CONSTELLATION[i + 1]);
          lineAdd(x0, y0, lerp(x0, x1, f), lerp(y0, y1, f), STAR_MID, .45);
        }
        for (let i = 0; i < n; i++) if (shown >= i) {
          const [x, y] = conPt(CONSTELLATION[i]);
          sparkle(x, y, 1.2 + .8 * Math.sin(t * 3 + i), STAR_MID);
        }
        if (shown > n) {
          const e = clamp((shown - n) / 3, 0, 1);
          const [lx, ly] = conPt(CON_EYES[0]), [rx, ry] = conPt(CON_EYES[1]);
          sparkle(lx, ly, 2 * e, STAR_MID);
          const wink = t > 10.5 && t < 11.1 && Math.floor(t * 8) & 1;
          if (!wink) { glow(rx, ry, 6, C.st3, .45 * e, 5, false); flare(rx, ry, Math.round(3 * e + Math.sin(t * 5)), C.st3, .7 * e); }
        }
        if (k < 1.2) skyStar(lerp(70, conPt(CON_EYES[1])[0], E.inOut(clamp(k / 1.2, 0, 1))), lerp(26, conPt(CON_EYES[1])[1], E.inOut(clamp(k / 1.2, 0, 1))), .7, t);
      },
    });
    drawActor(c, cx, cy, set.P.hd);
    if (S.laptop === true) { laptopGlow(c, cx, cy); blit(PROP.laptop, 41 - cx, 93 - cy); }
    else blit(PROP.laptopShut, 41 - cx, 99 - cy);
    drawFgGrass(cx, cy, t, set.P.fg);
    drawParts(1, cx, cy); drawParts(2, cx, cy);
    if (t < 3) brect(0, 0, W, H, C.black, 1 - prog(t, 2, 3));
  },
});

// ---- 9. the end
SCENES.push({
  name: 'end', dur: 0, tin: 'fade', tinDur: 1.2, tout: 'fade', toutDur: .8,
  init(S) {
    S.stars = once('endStars', () => makeStars(77, 90, 0, 96, 0, 120));
    const c = S.clawd = newClawd(48, 92);
    c.faceBase = 'smile';
    S.star = newStar(48, 0);
    S.star.broken = false; S.star.dim = 0; S.star.faceBase = 'happy'; S.star.glowK = .3; S.star.glowR = 10;
    S.focus = [48, 60];
    announce('The end. Tap to replay.');
  },
  update(S, dt) {
    const c = S.clawd, s = S.star, t = S.t;
    if (t > 1 && Math.floor((t - 1) / 2.2) !== Math.floor((S.pt - 1) / 2.2)) {
      jump(c, 95);
      if (Math.floor((t - 1) / 2.2) % 2) c.onLand = () => hearts(c.x, c.y - 16, 2);
    }
    const a = t * 1.9;
    s.x = 48 + Math.cos(a) * 20; s.y = 88 + Math.sin(a) * 5; s.lift = 12; s.front = Math.sin(a) > 0;
    if (rnd() < .5) emit({ type: 'glow', x: s.x + rr(-2, 2), y: s.y - s.lift - 5 + rr(-2, 2), vx: rr(-3, 3), vy: rr(-3, 3), life: .6, c: C.st3, s: .8, z: 0 });
    updClawd(c, dt); updStar(s, dt);
  },
  draw(S) {
    const c = S.clawd, s = S.star, t = S.t;
    skyGrad([[0, C.n0], [50, C.n1], [90, C.n2], [120, C.n3]], 0);
    drawStars(S.stars, t * 2, 0, t, 1, 96);
    const title = 'THE END', tw = textWidthBig(title), bounce = Math.round(Math.max(0, Math.sin(t * 2.2)) * -1.5);
    drawTextBig(title, Math.round((W - tw) / 2), 34 + bounce, C.cl3, C.ink);
    sparkle(18, 32, 2.8 * Math.max(0, Math.sin(t * 2.4)), C.st3);
    sparkle(78, 46, 2.8 * Math.max(0, Math.sin(t * 2.4 + 2.1)), C.st3);
    ellipseD(48, 93, 12, 2, C.n2, .8);
    drawParts(0, 0, 0);
    if (!s.front) drawStarActor(s, 0, 0, t);
    drawActor(c, 0, 0);
    if (s.front) drawStarActor(s, 0, 0, t);
    drawParts(1, 0, 0); drawParts(2, 0, 0);
    if (t > 1.5 && (Math.floor(t * 1.6) & 1)) {
      const h = 'TAP TO REPLAY';
      drawText(h, Math.round((W - textWidth(h)) / 2), 108, C.txDim, C.ink);
    }
  },
});

// ================================================================= boot
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight, dpr = window.devicePixelRatio || 1;
  const f = Math.min(vw / W, vh / H);
  const fi = Math.floor(f * dpr) / dpr;           // whole device pixels per game pixel
  // in portrait the canvas spans the full width (the page above and below continues its
  // edge colours); otherwise prefer whole-pixel scaling when it costs little space
  const portrait = vh / vw > H / W;
  const s = fi > 0 && fi >= f * (portrait ? .99 : .86) ? fi : f;
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
window.addEventListener('resize', fit);
fit();
function advance() { if (TR.phase !== 'out') goTo(SI + 1); }
window.addEventListener('pointerdown', e => { if (e.button > 0) return; advance(); });
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (TR.phase !== 'out') goTo(Math.max(0, SI - 1)); }
});
let last = 0, acc = 0;
const STEP = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > .1) dt = .1;
  if (Math.abs(dt - STEP) < .002) dt = STEP;
  acc += dt;
  let n = 0;
  while (acc >= STEP - 1e-6 && n < 6) { update(STEP); acc -= STEP; n++; }
  if (n) render();
}
startScene(0);
TR.phase = 'in'; TR.kind = 'fade'; TR.dur = 1; TR.t = 0;
render();
requestAnimationFrame(frame);
</script>
