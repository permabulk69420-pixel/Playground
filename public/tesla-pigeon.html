<style>

<script>
"use strict";
/* =====================================================================
   TESLA AND THE WHITE PIGEON
   A small pixel-art story, based on Nikola Tesla's own account of the
   white pigeon he loved in New York. Everything is drawn into a 96x120
   software framebuffer and scaled up with image-rendering: pixelated.
   ===================================================================== */

// ---------------------------------------------------------------- screen
const W = 96, H = 120;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const IMG = ctx.createImageData(W, H);
const FB = new Uint32Array(IMG.data.buffer);   // ABGR on little-endian

// ---------------------------------------------------------------- palette
const PAL = {
  ink: '#0e0b14', black: '#050409', white: '#ffffff',
  // night sky
  nt0: '#070914', nt1: '#0c1022', nt2: '#141a36', nt3: '#1d2549', nt4: '#28315c', nt5: '#363f70', nt6: '#4a5283', nt7: '#646b98',
  // dusk and dawn
  dk0: '#2e2650', dk1: '#523668', dk2: '#7e4776', dk3: '#b35c7c', dk4: '#e07c7c', dk5: '#f5a57c', dk6: '#fccf96', dk7: '#fff0c4',
  // buildings at night
  bd0: '#0a0c18', bd1: '#11152a', bd2: '#191f38', bd3: '#232a48',
  // brick and stone
  br0: '#1f141c', br1: '#2f1d27', br2: '#452833', br3: '#5e3642',
  sn0: '#23242f', sn1: '#32343f', sn2: '#464955', sn3: '#5e616e', sn4: '#7c7f8b', sn5: '#a2a4ae', sn6: '#c9cad0',
  // warm lamplight
  wl0: '#5a3a22', wl1: '#a8672e', wl2: '#e0a04a', wl3: '#f8cf78',
  // Tesla
  tc0: '#0d0b12', tc1: '#1a1722', tc2: '#2a2634', tc3: '#433d52', tc4: '#5e5770',
  shirt: '#e6e2d8', tie: '#4a2a3a',
  sk1: '#b07860', sk2: '#d9a282',
  hr0: '#15101a', hr1: '#2c2230', gy0: '#77737f', gy1: '#a9a5b0',
  // city pigeons (rock doves)
  pg0: '#2c3044', pg1: '#4a5068', pg2: '#6b7290', pg3: '#8f96b0', pgG: '#4f8f7c', pgP: '#7c5c9a', pgF: '#d6727f', pgE: '#e8923a',
  // the white pigeon: pure white with light gray wingtips
  wp1: '#bdbacd', wp2: '#dedbe8', wp3: '#f7f6fb', wpF: '#e58a96', wpB: '#e9c9c2',
  // street
  as0: '#0d0e18', pv0: '#1b1b28', pv1: '#262739', pv2: '#3a3c53',
  // wood, room and linen
  wd0: '#1c120f', wd1: '#2e1d17', wd2: '#472c20', wd3: '#6a432c', wd4: '#8f5d3a',
  rm1: '#1f1926', rm2: '#2b2333',
  ln0: '#3c3a4c', ln1: '#5e5c72', ln2: '#8a889e', ln3: '#b8b6c8',
  // laboratory and lightning
  lb0: '#0a0810', lb1: '#16111e', lb2: '#241b2e', cp0: '#4a2a1c', cp1: '#7a4a2a', cp2: '#b0703c', cp3: '#e0a060',
  lt1: '#a89cff', lt2: '#dcd6ff',
  // weather, props, text
  snow: '#e6ebff', rain: '#7d93c8', seed: '#d9b27a', paper: '#e8dfc6', lamp: '#ffd98a', moon: '#fff4d8',
  cream: '#efe3c4', creamD: '#b8a988', txDim: '#8a8298', du1: '#6f6a80',
  lgr1: '#2b5a45', lgr2: '#4f8f68', mo1: '#f1dfb0', mo2: '#d6bf8c',

const C = {};
for (const k in PAL) C[k] = hex(PAL[k]);

function hex(h) {
  const n = parseInt(h.slice(1), 16);
  return (0xff000000 | (n & 255) << 16 | (n & 0xff00) | (n >> 16 & 255)) >>> 0;
}
const cR = c => c & 255, cG = c => c >>> 8 & 255, cB = c => c >>> 16 & 255;
function rgb(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r; g = g < 0 ? 0 : g > 255 ? 255 : g; b = b < 0 ? 0 : b > 255 ? 255 : b;
  return (0xff000000 | (b & 255) << 16 | (g & 255) << 8 | (r & 255)) >>> 0;
}
function mix(a, b, t) {
  return rgb(cR(a) + (cR(b) - cR(a)) * t, cG(a) + (cG(b) - cG(a)) * t, cB(a) + (cB(b) - cB(a)) * t);
}

// ---------------------------------------------------------------- math
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const TAU = Math.PI * 2;
const E = {
  inOut: t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2,
  out: t => 1 - (1 - t) ** 3,
};
function mulberry(seed) {
  return function () {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = mulberry(7);
const rr = (a, b) => a + (b - a) * rnd();
const pick = arr => arr[Math.floor(rnd() * arr.length)];

// 4x4 ordered dither thresholds
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bay = (x, y) => BAYER[(y & 3) << 2 | (x & 3)];

// ---------------------------------------------------------------- drawing primitives
// Everything draws into the current target (the screen, or an offscreen layer).
let TB = FB, TW = W, TH = H;
function target(L) { if (L) { TB = L.buf; TW = L.w; TH = L.h; } else { TB = FB; TW = W; TH = H; } }

function pset(x, y, c) {
  x = Math.floor(x); y = Math.floor(y);
  if (x >= 0 && y >= 0 && x < TW && y < TH) TB[y * TW + x] = c;
}
function rect(x, y, w, h, c) {
  x = Math.round(x); y = Math.round(y);
  const x0 = Math.max(0, x), x1 = Math.min(TW, x + w), y0 = Math.max(0, y), y1 = Math.min(TH, y + h);
  if (x1 <= x0) return;
  for (let j = y0; j < y1; j++) TB.fill(c, j * TW + x0, j * TW + x1);
}
// dithered rectangle: only pixels whose threshold is below `a` are painted
function drect(x, y, w, h, c, a) {
  x = Math.round(x); y = Math.round(y);
  const x0 = Math.max(0, x), x1 = Math.min(TW, x + w), y0 = Math.max(0, y), y1 = Math.min(TH, y + h);
  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) if (bay(i, j) < a) TB[j * TW + i] = c;
}
function blendAt(i, c, a) {
  const d = TB[i];
  TB[i] = rgb(cR(d) + (cR(c) - cR(d)) * a, cG(d) + (cG(c) - cG(d)) * a, cB(d) + (cB(c) - cB(d)) * a);
}
function brect(x, y, w, h, c, a) {
  x = Math.round(x); y = Math.round(y);
  const x0 = Math.max(0, x), x1 = Math.min(TW, x + w), y0 = Math.max(0, y), y1 = Math.min(TH, y + h);
  for (let j = y0; j < y1; j++) for (let i = x0; i < x1; i++) blendAt(j * TW + i, c, a);
}
function addAt(i, r, g, b) {
  const d = TB[i];
  TB[i] = rgb(cR(d) + r, cG(d) + g, cB(d) + b);
}
function addPx(x, y, c, k = 1) {
  x = Math.floor(x); y = Math.floor(y);
  if (x >= 0 && y >= 0 && x < TW && y < TH) addAt(y * TW + x, cR(c) * k, cG(c) * k, cB(c) * k);
}
// soft light, quantised into a few dithered bands so it still reads as pixel art
function glow(cx, cy, rad, c, k = 1, steps = 4, dither = true) {
  if (rad <= 0 || k <= 0) return;
  const r = cR(c), g = cG(c), b = cB(c), r2 = rad * rad;
  const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(TW - 1, Math.ceil(cx + rad));
  const y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(TH - 1, Math.ceil(cy + rad));
  for (let y = y0; y <= y1; y++) {
    const dy = y + .5 - cy;
    for (let x = x0; x <= x1; x++) {
      const dx = x + .5 - cx, d2 = (dx * dx + dy * dy) / r2;
      if (d2 >= 1) continue;
      const f = (1 - d2) * (1 - d2) * k;
      const q = Math.floor(f * steps + (dither ? bay(x, y) : .5)) / steps;
      if (q > 0) addAt(y * TW + x, r * q, g * q, b * q);
    }
  }
}
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let n = 0; n < 600; n++) {
    pset(x0, y0, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function lineAdd(x0, y0, x1, y1, c, k) {
  const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1));
  for (let i = 0; i <= n; i++) addPx(Math.round(lerp(x0, x1, i / n)), Math.round(lerp(y0, y1, i / n)), c, k);
}
function disc(cx, cy, r, c) {
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) {
    const dy = y + .5 - cy, hw = r * r - dy * dy;
    if (hw < 0) continue;
    const s = Math.sqrt(hw);
    const x0 = Math.round(cx - s), x1 = Math.round(cx + s);
    if (y >= 0 && y < TH) rect(x0, y, x1 - x0, 1, c);
  }
}
// cheap deterministic hash for textures
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) | 0;
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}

// ---------------------------------------------------------------- sprites
function spr(rows, key) {
  const h = rows.length, w = rows[0].length;
  const px = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) {
    if (rows[y].length !== w) throw new Error('ragged sprite row ' + y + ': ' + rows[y]);
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      const name = key[ch];
      if (!name) throw new Error('no colour for "' + ch + '"');
      px[y * w + x] = C[name];
    }
  }
  return { w, h, px, rows };
}
// blit with optional mirror, solid colour (silhouette / flash) and dithered alpha
function blit(s, x, y, flip = false, solid = 0, alpha = 1) {
  x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < s.h; j++) {
    const yy = y + j;
    if (yy < 0 || yy >= TH) continue;
    for (let i = 0; i < s.w; i++) {
      const xx = x + i;
      if (xx < 0 || xx >= TW) continue;
      const c = s.px[j * s.w + (flip ? s.w - 1 - i : i)];
      if (!c) continue;
      if (alpha < 1 && bay(xx, yy) >= alpha) continue;
      TB[yy * TW + xx] = solid || c;
    }
  }
}

function textWidth(s) {
  let w = 0;
  for (const ch of s) { const g = FONT[ch] || FONT[' ']; w += g.w + 1; }
  return Math.max(0, w - 1);
}
function drawText(s, x, y, c, shadow = 0, alpha = 1) {
  x = Math.round(x); y = Math.round(y);
  let cx = x;
  for (const ch of s) {
    const g = FONT[ch] || FONT[' '];
    for (let j = 0; j < 5; j++) for (let i = 0; i < g.w; i++) {
      if (g.rows[j][i] !== '#') continue;
      const X = cx + i, Y = y + j;
      if (alpha < 1 && bay(X, Y) >= alpha) continue;
      if (shadow) { pset(X + 1, Y, shadow); pset(X, Y + 1, shadow); pset(X + 1, Y + 1, shadow); }
      pset(X, Y, c);
    }
    cx += g.w + 1;
  }
  return cx - x - 1;
}
function wrapText(s, maxW) {
  const lines = [];
  for (const para of s.split('\n')) {
    let cur = '';
    for (const w of para.split(' ')) {
      const t = cur ? cur + ' ' + w : w;
      if (textWidth(t) <= maxW || !cur) cur = t; else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
  }
  return lines;
}


// ---------------------------------------------------------------- parallax layers
function layer(w, h, paint) {
  const L = { w, h, buf: new Uint32Array(w * h) };
  target(L); paint(L); target(null);
  return L;
}
function drawLayer(L, ox, oy, wrap = true) {
  ox = Math.round(ox); oy = Math.round(oy);
  const y0 = Math.max(0, oy), y1 = Math.min(H, oy + L.h), buf = L.buf, lw = L.w;
  for (let y = y0; y < y1; y++) {
    const row = (y - oy) * lw, o = y * W;
    if (wrap) {
      let lx = ((-ox) % lw + lw) % lw;
      for (let x = 0; x < W; x++) {
        const c = buf[row + lx];
        if (c) FB[o + x] = c;
        if (++lx === lw) lx = 0;
      }
    } else {
      const xa = Math.max(0, ox), xb = Math.min(W, ox + lw);
      for (let x = xa; x < xb; x++) { const c = buf[row + x - ox]; if (c) FB[o + x] = c; }
    }
  }
}
// a copy of a layer with some colours swapped (cached): used for the sunrise palette shift
// moonlit rims: recolour filled pixels (optionally only of colour `match`)
// whose neighbour (dx, dy) is empty or a different colour
function rimLayer(L, col, dx, dy, match = 0, wrap = true) {
  const src = L.buf.slice(), out = L.buf, w = L.w, h = L.h;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x, c = src[i];
    if (!c || (match && c !== match)) continue;
    let nx = x + dx; const ny = y + dy;
    if (wrap) nx = (nx % w + w) % w;
    if (ny < 0 || ny >= h || nx < 0 || nx >= w || src[ny * w + nx] !== c) out[i] = col;
  }
}
// a ridge line that wraps seamlessly over w
function ridge(seed, w, base, comps) {
  const r = mulberry(seed), ph = comps.map(() => r() * TAU), out = new Float32Array(w);
  for (let x = 0; x < w; x++) {
    let v = base;
    for (let i = 0; i < comps.length; i++) v += Math.sin(x / w * TAU * comps[i][0] + ph[i]) * comps[i][1];
    out[x] = v;
  }
  return out;
}
// vertical sky gradient with ordered dithering between colour stops [[worldY, colour], ...]
function skyGrad(stops, oy = 0) {
  for (let y = 0; y < H; y++) {
    const wy = y + oy;
    let k = 0;
    while (k < stops.length - 2 && wy >= stops[k + 1][0]) k++;
    const a = stops[k], b = stops[k + 1];
    const t = clamp((wy - a[0]) / (b[0] - a[0]), 0, 1), o = y * W, yy = (Math.floor(wy) & 3) << 2;
    for (let x = 0; x < W; x++) FB[o + x] = BAYER[yy | (x & 3)] < t ? b[1] : a[1];
  }
}
function makeStars(seed, n, x0, x1, y0, y1) {
  const r = mulberry(seed), out = [];

// ---- the last years: snow, a messenger feeding the pigeons, his window high above
const TOWER_TOP = -170, TESLA_WIN = [54, -128];     // his window sits on the facade's window grid
function drawTower(S, cx, cy, windowLit) {
  const x0 = 12, x1 = 108;
  for (let y = 0; y < H; y++) {
    const wy = y + cy;
    if (wy < TOWER_TOP || wy > 100) continue;
    const fx0 = Math.round(x0 - cx), fx1 = Math.round(x1 - cx);
    rect(fx0, y, fx1 - fx0, 1, C.br1);
    for (let px = x0; px < x1; px += 12) { const sx = Math.round(px - cx); rect(sx, y, 2, 1, C.br2); pset(sx + 2, y, C.br0); }
  }
  rect(Math.round(x0 - cx) - 2, TOWER_TOP - cy - 3, x1 - x0 + 4, 3, C.sn2);
  for (let wy = TOWER_TOP + 10; wy < 70; wy += 16) for (let px = x0 + 4; px < x1 - 6; px += 12) {
    const sx = Math.round(px - cx), sy = Math.round(wy - cy);
    if (sy < -12 || sy > H) continue;
    const mine = px === TESLA_WIN[0] - 2 && wy === TESLA_WIN[1];
    const lit = mine ? windowLit > 0 : hash2(px, wy) < .18;
    rect(sx - 1, sy - 1, 8, 11, C.br0);
    rect(sx, sy, 6, 9, lit ? (mine ? mix(C.bd1, C.wl2, windowLit) : C.wl1) : C.bd1);
    if (lit && !mine) rect(sx, sy, 6, 3, C.wl2);
    rect(sx - 1, sy + 9, 8, 1, C.snow);                 // snow on the sill
    if (mine && windowLit > 0) {
      glow(sx + 3, sy + 4, 9, C.wl2, .2 * windowLit, 5, false);
      disc(sx + 3, sy + 4, 1.8, C.tc0); rect(sx + 1, sy + 6, 5, 3, C.tc0); rect(sx + 2, sy + 2, 3, 1, C.gy1);
    }
  }
  // the street below
  const gy = 100 - cy;
  if (gy < H) {
    rect(0, gy, W, H - gy, C.pv1); rect(0, gy, W, 2, C.snow); rect(0, gy + 2, W, 1, C.ln2);
    for (let x = ((-Math.round(cx)) % 7 + 7) % 7; x < W; x += 7) pset(x, gy + 4, C.ln1);
  }
}

    if (at(10.6)) caption('HE DIED IN HIS HOTEL ROOM IN JANUARY 1943, AT THE AGE OF 86.', 4.3);
    if (t > 12.4) S.lit = Math.max(0, S.lit - dt * .7);
    if (rnd() < dt * 40) emit({ type: 'snow', x: rr(-10, 106), y: S.cam.y - 4, vx: rr(-4, 2), vy: rr(8, 16), life: 14, s: rnd() < .3 ? 2 : 1, z: 2, upd: p => { p.vx += Math.sin(p.t * 1.7 + p.x) * .15; } });
  },
  draw(S) {
    const t = S.t, cx = S.cam.x, cy = S.cam.y;
    skyGrad([[-260, C.nt1], [-120, C.nt2], [0, C.nt3], [100, C.nt4]], cy * .3);
    drawTower(S, cx, cy, S.lit);
    const lx = 72 - cx, ly = 102 - cy;
    if (ly - 36 < H) { streetLamp(Math.round(lx), 102, cy); lampPool(lx, ly + 3); }
    if (S.boy.y - cy - 21 < H) blit(PROP.boy, S.boy.x - cx - 5, S.boy.y - cy - 20);
    drawParts(1, cx, cy);
    drawFlock(S.flock.filter(p => p.state !== 'wait'), cx, cy);
    drawParts(2, cx, cy);
    vignette(.9);
  },
});

// ---- the end
SCENES.push({
  name: 'end', dur: 0, tin: 'fade', tinDur: 1.6, tout: 'fade', toutDur: .8,
  init(S) { S.cam.y = 0; announce('Nikola Tesla, 1856 to 1943. Tap to replay.'); },
  update(S, dt) {},
  draw(S) {
    const t = S.t;
    drawCity(S, { moon: [42, 40], sky2: () => { const k = (t - 1.5) % 9; if (k > 0 && k < 6) flyer(S, t - k, 6, 58, 46); } });
    const a = prog(t, 1, 3);
    if (a > 0) {
      const c = mix(C.nt1, C.cream, a), d = mix(C.nt1, C.creamD, a);
      const n1 = 'NIKOLA TESLA', n2 = '1856 - 1943';
      drawText(n1, Math.round((W - textWidth(n1)) / 2), 14, c, C.ink);
      rect(30, 22, 36, 1, d); pset(47, 23, d); pset(48, 23, d);
      drawText(n2, Math.round((W - textWidth(n2)) / 2), 26, d, C.ink);
    }
    vignette(.9);
    if (t > 4 && (Math.floor(t * 1.6) & 1)) { const h = 'TAP TO REPLAY'; drawText(h, Math.round((W - textWidth(h)) / 2), 111, C.txDim, C.ink); }
  },
});

// ================================================================= boot
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight, dpr = window.devicePixelRatio || 1;
  const f = Math.min(vw / W, vh / H);
  const fi = Math.floor(f * dpr) / dpr;           // whole device pixels per game pixel
  // in portrait the canvas spans the full width (the page above and below continues its
  // edge colours); otherwise prefer whole-pixel scaling when it costs little space
  const portrait = vh / vw > H / W;
  const s = fi > 0 && fi >= f * (portrait ? .99 : .86) ? fi : f;
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
window.addEventListener('resize', fit);
fit();
function advance() { if (TR.phase !== 'out') goTo(SI + 1); }
window.addEventListener('pointerdown', e => { if (e.button > 0) return; advance(); });
window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); advance(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (TR.phase !== 'out') goTo(Math.max(0, SI - 1)); }
});
let last = 0, acc = 0;
const STEP = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > .1) dt = .1;
  if (Math.abs(dt - STEP) < .002) dt = STEP;
  acc += dt;
  let n = 0;
  while (acc >= STEP - 1e-6 && n < 6) { update(STEP); acc -= STEP; n++; }
  if (n) render();
}
startScene(0);
TR.phase = 'in'; TR.kind = 'fade'; TR.dur = 1; TR.t = 0;
render();
requestAnimationFrame(frame);
</script>
