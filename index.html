<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#17191b" />
  <title>VR Playground</title>
</head>
<body>
  <canvas id="world"></canvas>
  <div id="hud">
    <div class="title">VR PLAYGROUND</div>
    <div class="hint">Left stick: move · Right stick: smooth turn</div>
    <div class="hint">Magic: hold A, palms inward, alternate hands up/down, then push both forward.</div>
    <div id="magic-status" class="hint"></div>
    <button id="demo-blast" type="button">Preview magic blast</button>
    <button id="enter-vr" type="button" disabled>Checking VR…</button>
    <div id="status"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
